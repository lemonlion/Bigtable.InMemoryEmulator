name: SDK Compatibility Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Specific SDK version to test (leave empty for latest)'
        required: false
        type: string

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  compatibility-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest-stable
            prerelease: false
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet-build
        with:
          build: false

      - name: Determine SDK version
        id: sdk-version
        shell: bash
        run: |
          if [ -n "${{ inputs.sdk_version }}" ]; then
            VERSION="${{ inputs.sdk_version }}"
          else
            VERSION=$(dotnet package search Google.Cloud.Bigtable.V2 \
              --format json \
              | jq -r '.searchResult[0].packages[0].latestVersion')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "## SDK Version: $VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Override Bigtable SDK version
        run: |
          dotnet add src/Bigtable.InMemoryEmulator/Bigtable.InMemoryEmulator.csproj \
            package Google.Cloud.Bigtable.V2 \
            --version ${{ steps.sdk-version.outputs.version }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Run full unit test suite
        id: unit-tests
        continue-on-error: true
        run: |
          dotnet test tests/Bigtable.InMemoryEmulator.Tests.Unit \
            --configuration Release --no-build \
            --framework net8.0 \
            -v quiet \
            --logger "trx;LogFileName=unit-results.trx"

      - name: Run integration test suite
        id: integration-tests
        continue-on-error: true
        run: |
          dotnet test tests/Bigtable.InMemoryEmulator.Tests.Integration \
            --configuration Release --no-build \
            --framework net8.0 \
            -v quiet \
            --logger "trx;LogFileName=integration-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            **/TestResults/*.trx
          retention-days: 30

      - name: Summarise results
        if: always()
        shell: bash
        run: |
          echo "### Results for ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- SDK Version: ${{ steps.sdk-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: ${{ steps.unit-tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: ${{ steps.integration-tests.outcome }}" >> $GITHUB_STEP_SUMMARY

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.sdk-version.outputs.version }}';
            const matrixName = '${{ matrix.name }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'sdk-compatibility',
              state: 'open',
            });

            const alreadyReported = existingIssues.data.some(
              issue => issue.title.includes(version)
            );

            if (!alreadyReported) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `SDK compat break: Google.Cloud.Bigtable.V2 ${version} (${matrixName})`,
                body: [
                  `## SDK Compatibility Break Detected`,
                  ``,
                  `The scheduled SDK compatibility check failed against **Google.Cloud.Bigtable.V2 v${version}** on **${matrixName}**.`,
                  ``,
                  `### Action Items`,
                  `1. Review the [CI run](${runUrl}) to identify which tests failed`,
                  `2. Fix the incompatibility and add regression tests`,
                  `3. If the fix requires a behavioral change, document it in the wiki`,
                ].join('\n'),
                labels: ['sdk-compatibility', 'bug'],
              });
            }
